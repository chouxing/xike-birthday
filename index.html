<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>給西克的生日驚喜 ♡</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;800;900&family=Fredoka:wght@500;700&display=swap');
:root{--pink:#ff8cbe;--soft:#ffd7e9;--ink:#15131b;--white:#fffafd}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:'Fredoka','Noto Sans TC',sans-serif;background:#15131b;color:#fff;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 15%,#ff8cbe35,transparent 35%),radial-gradient(circle at 88% 80%,#ff8cbe25,transparent 30%),repeating-linear-gradient(145deg,transparent 0 54px,#ffffff07 55px 56px);z-index:-1}.shell{max-width:900px;margin:auto;padding:30px 20px 70px;text-align:center}.eyebrow{display:inline-block;border:1px solid #ffb7d6;border-radius:100px;padding:8px 16px;color:#ffc1dd;font-size:12px;letter-spacing:3px}.title{font-size:clamp(42px,9vw,88px);line-height:1.08;margin:23px 0 8px;font-weight:900;letter-spacing:2px;text-shadow:5px 5px 0 #ef6da2}.subtitle{color:#ffd4e7;font-size:clamp(14px,2.7vw,19px)}.stage{position:relative;max-width:550px;margin:32px auto 20px;min-height:440px;display:grid;place-items:center;border:2px solid #ffb7d6;border-radius:32px;background:linear-gradient(145deg,#2b202e,#131117);box-shadow:0 0 0 8px #ff8cbe12,0 22px 70px #0006;overflow:hidden}.stage:before{content:"✦     ♡      ✧";position:absolute;top:28px;left:0;right:0;color:#ffb7d6;font-size:30px;letter-spacing:23px}.gift{font-size:140px;filter:drop-shadow(0 15px 10px #0005);animation:bounce 1.8s infinite;cursor:pointer;user-select:none}.hint{color:#ffd8e8;margin:20px 0}.button{appearance:none;border:0;background:var(--pink);color:#17111a;padding:15px 32px;font-family:inherit;font-size:17px;font-weight:900;border-radius:99px;box-shadow:0 7px 0 #bd467a;cursor:pointer;transition:transform .15s,box-shadow .15s}.button:hover{transform:translateY(-3px)}.button:active{transform:translateY(5px);box-shadow:0 2px 0 #bd467a}.smallbtn{font-size:14px;padding:11px 19px;margin:8px}.surprise{display:none;width:100%;padding:24px 18px 26px;animation:pop .8s cubic-bezier(.16,1.4,.3,1) both}.surprise.show{display:block}.photo-wrap{width:min(72vw,315px);margin:34px auto 18px;position:relative;transform:rotate(-3deg);background:#fff;padding:10px 10px 35px;box-shadow:0 15px 35px #0008}.photo-wrap img{display:block;width:100%;aspect-ratio: 0.84;object-fit:cover;object-position:center top}.photo-wrap:after{content:'GEN ♡';position:absolute;bottom:9px;left:0;right:0;color:#ef6da2;font-weight:900;letter-spacing:3px}.sticker{position:absolute;font-size:44px;right:-28px;top:-19px;animation:wiggle 1.5s infinite}.big-message{font-weight:900;color:#fff;font-size:clamp(30px,6vw,55px);line-height:1.35;text-shadow:3px 4px 0 #ed6b9e}.big-message span{color:#ff9cc8}.note{font-size:15px;line-height:2.1;color:#ffdded;max-width:430px;margin:12px auto}.actions{margin-top:24px}.foot{margin-top:32px;font-size:12px;letter-spacing:2px;color:#e4abc5}.sparkle{position:absolute;pointer-events:none;user-select:none;animation:fall linear forwards;z-index:20}.floatheart{position:fixed;pointer-events:none;animation:rise 2.2s ease-out forwards;z-index:40}.hidden{display:none!important}.tiny{color:#bfaeb9;font-size:12px;margin:13px 0}.count{color:#ffc1de;font-weight:bold}@keyframes bounce{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-17px) rotate(5deg)}}@keyframes pop{0%{opacity:0;transform:scale(.25) rotate(-8deg)}75%{opacity:1}100%{opacity:1;transform:scale(1)}}@keyframes fall{from{transform:translateY(-30px) rotate(0);opacity:1}to{transform:translateY(110vh) rotate(720deg);opacity:0}}@keyframes rise{from{transform:translateY(0) scale(.6);opacity:1}to{transform:translateY(-170px) scale(1.7);opacity:0}}@keyframes wiggle{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(14deg)}}@media(max-width:530px){.stage{min-height:390px}.gift{font-size:115px}.shell{padding-top:22px}.photo-wrap{width:min(65vw,255px)}.stage:before{letter-spacing:10px}}
</style>
</head>
<body><main class="shell"><div class="eyebrow">♡ SECRET BIRTHDAY MISSION ♡</div><h1 class="title">FOR 西克<span style="color:#ffb1d2">♡</span></h1><p class="subtitle">今天有一份來自粉黑白宇宙的特別禮物……</p><section class="stage" id="stage"><div id="intro"><div class="gift" id="gift" role="button" tabindex="0" aria-label="拆開禮物">🎁</div><p class="hint">警告：打開後可愛度可能超標！</p><button class="button" id="open">點我拆開驚喜 ✦</button></div><div class="surprise" id="surprise"><div class="photo-wrap"><img src="photo.webp" alt="鳴海弦風格角色扮演照片"><div class="sticker">💗</div></div><div class="big-message"><span>西克！</span><br>生日快樂！！🎂</div><p class="note">恭喜你成功解鎖新的一歲 ♡<br>願你每天都能開心到閃閃發亮，<br>想做的事都順順利利、喜歡的角色永遠陪著你！<br>今天你就是全宇宙最值得被寵愛的主角 ✨</p><div class="actions"><button class="button smallbtn" id="hearts">領取生日愛心 💖</button><button class="button smallbtn" id="again">再來一次驚喜 ↻</button></div><p class="tiny">已收到 <span class="count" id="count">0</span> 顆生日愛心 ♡</p></div></section><p class="foot">PINK × BLACK × WHITE · HAPPY BIRTHDAY ♡</p></main><script>
const $=x=>document.getElementById(x);let count=0;function confetti(n=125){const marks=['💗','♡','✦','★','🎀','✧','🤍'];for(let i=0;i<n;i++){const e=document.createElement('div');e.className='sparkle';e.textContent=marks[Math.random()*marks.length|0];e.style.left=Math.random()*100+'vw';e.style.top='-35px';e.style.fontSize=(12+Math.random()*24)+'px';e.style.animationDuration=(2.6+Math.random()*2.9)+'s';e.style.animationDelay=(Math.random()*.8)+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),6500)}}function openGift(){$('intro').classList.add('hidden');$('surprise').classList.add('show');confetti();setTimeout(()=>confetti(65),750)}$('open').onclick=openGift;$('gift').onclick=openGift;$('gift').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openGift()}};$('hearts').onclick=()=>{count+=10;$('count').textContent=count;for(let i=0;i<18;i++){let e=document.createElement('div');e.className='floatheart';e.textContent=['💗','💖','🤍','💕'][i%4];e.style.left=(10+Math.random()*80)+'vw';e.style.top=(58+Math.random()*35)+'vh';e.style.fontSize=(20+Math.random()*26)+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),2300)}};$('again').onclick=()=>{confetti(150);$('surprise').style.animation='none';void $('surprise').offsetWidth;$('surprise').style.animation='pop .8s cubic-bezier(.16,1.4,.3,1) both'};
</script></body></html>
